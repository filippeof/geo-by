<svg xmlns="http://w3.org" viewBox="0 0 100 100">
  <!-- Rounded Dark Background for Contrast -->
  <rect width="100" height="100" rx="22" fill="#0F172A"/>
  
  <!-- Grid Lines (Subtle Background) -->
  <line x1="15" y1="35" x2="85" y2="35" stroke="#334155" stroke-width="2" stroke-dasharray="4"/>
  <line x1="15" y1="65" x2="85" y2="65" stroke="#334155" stroke-width="2" stroke-dasharray="4"/>
  
  <!-- Shaded Area Under the Graph Curve -->
  <path d="M 15 75 L 15 55 Q 32 25 45 45 T 75 25 L 85 20 L 85 75 Z" fill="#10B981" fill-opacity="0.15"/>
  
  <!-- Main Trend Line (Smooth Bezier Curves) -->
  <path d="M 15 55 Q 32 25 45 45 T 75 25 L 85 20" fill="none" stroke="#10B981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Accent Data Nodes (Points of Interest) -->
  <circle cx="15" cy="55" r="4" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <circle cx="45" cy="45" r="4" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <circle cx="75" cy="25" r="4" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <circle cx="85" cy="20" r="5" fill="#FFFFFF"/>
</svg>