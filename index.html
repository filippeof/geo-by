<!DOCTYPE html>
<!-- Plots elevation profile with drill core data from Bayern
Dependencies:
 https://github.com/Turfjs/turf
 https://github.com/maplibre/maplibre-gl-js/
 
-->
<html lang='en'>
  <head>
    <meta charset='UTF-8'>
    <title>GEO3-BY</title>
    <meta name="author" content="Filippe F.">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="icon" href="src/img/by_profi.ico">

    <!-- Maplibre -->
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@^6.6.0/dist/maplibre-gl.css" />

    <!-- Turf -->
    <!-- <script src="src/js/turf.min.js" charset="utf-8"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.0/turf.min.js"></script>

     <!-- style -->
    <link rel='stylesheet' href='src/css/style.css'>
    <!-- Profile tools -->
    <script src='src/js/profile_tool.js'></script>
    <!-- Map definitions, layers style -->
    <script src='src/js/map_defs.js'></script>
    <!-- Layer, Profile Controls -->
    <script src='src/js/custom_control.js'></script>
    <!-- Drill core data -->
    <script src='src/js/dc_data.js'></script>

  </head>
  <body>

    <div id="map"></div>

    <div id="ele_profile_container" style="display: none;">
        <svg xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 1000 250" id= "ele_profile_svg">
            <defs>
                <!-- Clip polygon: points set dinamically for each profile-->
                <clipPath id="profile_clip">
                    <polygon id="profile_clip_poly" points="20,20 950,20 950,230 20,230" fill="white"/> 
                </clipPath>
            </defs>
            <!-- Label -->
            <g id= "profile_txt_group" >
                <line id="max_ele_line" x1="30" y1="20" x2="970" y2="20" stroke="#000000" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="4,4"/>
                <text id="ele_txt" text-anchor="middle" transform="translate(5,120) rotate(90)" class="ele_profile_txt">Elevation (m)</text>
                <text id="min_ele_txt" x="2" y="20" class="ele_profile_txt">_</text>
                <text id="max_ele_txt" x="2" y="230" class="ele_profile_txt">_</text>
                
                <text id="max_dist_txt" text-anchor="end"  x="975" y="248" class="ele_profile_txt">_</text>
                <text id="dist_txt" text-anchor="middle" x="480" y="248" class="ele_profile_txt">Distance (km)</text>
            </g>
            <!-- Elevation profile polygon: points set dinamically for each profile -->
            <polygon id="elevation_profile_poly" points="20,20 950,20 950,230 20,230" fill="white" stroke="black" stroke-width="2"/>
            <!-- Drill cores -->
            <!-- All items in clip-group are clipped to Boundary polygon -->
            <g id= "clip-group" clip-path="url(#profile_clip)">
                <line id="cursor_ele_line" x1="20" y1="230" x2="20" y2="20" stroke="black" stroke-width="1"/>
                <g id="dc-profile-groups"></g> <!-- dynamically fill with dcs -->
            </g>

        </svg>
        <input id="ele_profile_download" type="button" value="💾" onclick="download_profile()"></input>
    </div>
    <script type="module">
        // import * as maplibregl from './src/js/maplibre_6-5/dist/maplibre-gl.mjs';
        import * as maplibregl from 'https://unpkg.com/maplibre-gl@^6.6.0/dist/maplibre-gl.mjs';

        //add geojson sources to map style
        map_style.sources["dc_lyr_src"]["data"] = dc_geojson;
        map_style.sources["profile_lyr_src"]["data"] = geojson_profile;
        
        // Initialize the map
        const map = new maplibregl.Map({
            container: 'map', // ID of the HTML element
            pitch: 55,
            minZoom: 4,
            maxZoom: 18,
            maxPitch: 75,
            style: map_style,
            zoom: 8,
            center: [11.5,48.5],
        });
        // Add default navigation controls (zoom/rotation buttons), scale 
        map.addControl(new maplibregl.NavigationControl({visualizePitch: true, showZoom: true, showCompass: true}), 'top-right');
        map.addControl(new maplibregl.ScaleControl({maxWidth: 100, unit: 'metric'}), 'bottom-left'); 
        map.addControl(new maplibregl.TerrainControl({ source: 'mapterhorn_terrain_src', exaggeration: v_ex }));
        map.addControl(new maplibregl.GeolocateControl({ }), 'bottom-right');
    
        //and custom controls
        map.addControl(new LayerControl(layerList), 'top-right');
        map.addControl(new ProfileControl(), 'top-right');
        // Create popup
        const dc_popup = new maplibregl.Popup({
            closeButton: false,
            closeOnClick: false
        });
        const get_info_popup = new maplibregl.Popup({
            closeButton: true,
            closeOnClick: true,
            maxWidth:"400px"
        });

        // Map interaction
        // Hover on  profile line
        map.on('load', async () => {
            map.on('mousemove', 'profile-layer', (e) => {
                // map.getCanvas().style.cursor = 'crosshair';
                // console.log("Mousemove event on profile-layer:", e.lngLat);
                if (clickedCoords.length == 2) {
                    const start_pt = turf.point(clickedCoords[0]);
                    const end_pt = turf.point(clickedCoords[1]);
                    const cur_pt = turf.point([e.lngLat.lng,e.lngLat.lat]);
                    const hover_distance = turf.distance(start_pt, cur_pt, {units: "kilometers"});
                    // profile_distance = calc_distance(start_pt,end_pt); calculated at second click
                    // make sure is within profile 
                    const dist_ratio = Math.min(Math.max(hover_distance/profile_distance,0),1) 
                    const line_x = svg_horz_margin + svg_w*dist_ratio;
                    let svg_line = document.getElementById("cursor_ele_line");
                    svg_line.setAttribute("x1", line_x);
                    svg_line.setAttribute("x2", line_x);
                }
            });

            // When the mouse leaves the profile layer, return line to left
            map.on('mouseleave', 'profile-layer', () => {
                // map.getCanvas().style.cursor = '';
                let svg_line = document.getElementById("cursor_ele_line");
                svg_line.setAttribute("x1", svg_horz_margin);
                svg_line.setAttribute("x2", svg_horz_margin);
            });
        });

        
        //POPUP DRILL CORES
        map.on('mousemove', 'dc-layer', (e) => {
            const coordinates = e.features[0].geometry.coordinates.slice();
            const obj_id = e.features[0].properties["oid"];
            // console.log(obj_id);
            // Ensure that if the map is zoomed out such that multiple
            // copies of the feature are visible, the popup appears
            // over the copy being pointed to.
            // while (Math.abs(e.lngLat.lng - coordinates[0]) > 180) {
            //     coordinates[0] += e.lngLat.lng > coordinates[0] ? 360 : -360;
            // }
            const cur_dc_data = dc_layer_dict[obj_id] ?? {"dc_h":"N/A","max_d":"N/A"};
            // console.log("Clicked drill core:", obj_id, "Data:", cur_dc_data);
            const popup_html = `<strong>${obj_id}</strong> <br> 
                          <a>Altitude: ${cur_dc_data["dc_h"]} m </a> <br> 
                          <a>Max Depth: ${cur_dc_data["max_d"]} m</a>`;
            
            dc_popup.setLngLat(coordinates).setHTML(popup_html).addTo(map);

        });


        // Change it back to a pointer when it leaves.
        map.on('mouseleave', 'dc-layer', () => {
            if (document.profile_tool_active) {
                map.getCanvas().style.cursor = 'crosshair';
            }
            else{
                map.getCanvas().style.cursor = '';
            }
            dc_popup.remove();
        });
        //TODO: if hover over svg profile, highlight in geojson line profile?
        
        // Profile

        

        function toggle_edit_profile(e) {
            if (document.profile_tool_active) {
                // Hide Profile
                e.srcElement.value = "Create Profile"
                document.profile_tool_active = false;
                map.getCanvas().style.cursor = '';
                console.log("Profile tool stopped");
                const profile_container = document.getElementById("profile_container")
                profile_container.style.display = "none";
                clickedCoords = []; // Reset if already have two points
            } else {
                // Show Profile
                document.profile_tool_active = true;
                map.getCanvas().style.cursor = 'crosshair';
                e.srcElement.value = "Stop Profile"
                const profile_container = document.getElementById("profile_container")
                profile_container.style.display = "block";
                console.log("Profile tool started");
            }
        }

        map.on('click', async (e) => {
            if (document.profile_tool_active == true){
                // Extract [lng, lat] from the click event
                const lngLat = [e.lngLat.lng, e.lngLat.lat];
                if (clickedCoords.length == 2) {
                    clickedCoords = []; // Reset if already have two points
                }
                if (turf.booleanWithin(turf.point(lngLat), bbox_by_poly)) {                      
                    clickedCoords.push(lngLat);
                    }
                else{
                    alert("Point outside BY")
                    return
                }

                // console.log(`Click ${clickedCoords.length}:`, lngLat);
                if (clickedCoords.length == 1) {
                    geojson_profile.features[1].geometry.coordinates = lngLat; // Update start point
                    map.getSource('profile_lyr_src').setData(geojson_profile);
                    
                }
                // Two points clicked: update the line
                else if (clickedCoords.length == 2) {
                    // Show dialog
                    let progress_dialog = document.createElement("dialog");
                    progress_dialog.innerHTML = "<p>Calculating Profile...</p>"
                    document.body.appendChild(progress_dialog);
                    progress_dialog.showModal();
                    // Make elevation profile
                    geojson_profile.features[2].geometry.coordinates = lngLat; // Update end point
                    geojson_profile.features[0].geometry.coordinates = clickedCoords;
                    map.getSource('profile_lyr_src').setData(geojson_profile);
                    profile_distance = turf.distance(clickedCoords[0],clickedCoords[1],{units:"kilometers"});
                    show_elevation_profile(map)  
                    // Close dialog
                    progress_dialog.close();           
                    document.body.removeChild(progress_dialog);          
                }
                else{
                    clickedCoords = []; // Reset for the next line
                }
                }
            else{
                let map_z = map.getZoom(); 
                if (map_z<min_zoom_feature_info){
                    return
                }
                // on click WMS layers with info: GetFeatureInfo
                let popup_html =""
                for (let index = 0; index < feature_info_layers.length; index++) {
                    const lyr_def = feature_info_layers[index];
                    if (map_z<lyr_def["minzoom"] || map_z > lyr_def["maxzoom"]){
                        continue
                    }
                    const lyr_id = lyr_def["id"];
                    if (map.getLayoutProperty(lyr_id, 'visibility') != 'none'){ //visible
                        const lng = e.lngLat.lng;
                        const lat = e.lngLat.lat;
                        // Fetch info
                        const feature_info_tbl = await get_feature_info(lng, lat, lyr_def);
                        popup_html += `${feature_info_tbl}`;
                    }
                }
                if (popup_html!="") {
                    get_info_popup.setLngLat(e.lngLat).setHTML(popup_html).addTo(map);
                }
            }
        });


        // map.on('mousemove', (e) => {
            // document.getElementById('info').innerHTML =
            //     // e.point is the x, y coordinates of the mousemove event relative
            //     // to the top-left corner of the map
            //     `${JSON.stringify(e.point)
            //     }<br />${
            //         // e.lngLat is the longitude, latitude geographical position of the event
            //         JSON.stringify(e.lngLat.wrap())}`;
            // });

    </script>
  </body>
</html>
